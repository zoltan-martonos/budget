spring.config.import=optional:file:./.env[.properties]
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3.3}
spring.ai.ollama.init.pull-model-strategy=never
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.annotation-scanner.enabled=false
spring.datasource.url=jdbc:h2:file:./data/personal-budget;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.data.web.pageable.max-page-size=100
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_updates=true
budget.auth.enabled=true
budget.auth.google.client-id=${BUDGET_GOOGLE_CLIENT_ID:}
budget.auth.google.client-secret=${BUDGET_GOOGLE_CLIENT_SECRET:}
budget.auth.legacy-owner-email=${BUDGET_ALLOWED_EMAIL:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${BUDGET_COOKIE_SECURE:false}
server.servlet.session.cookie.max-age=14d
server.servlet.session.timeout=14d
logging.level.com.example.springjpa.security=INFO